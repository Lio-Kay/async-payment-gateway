[project]
name = "async-payment-gateway"
version = "0.1.0"
description = "Async payment processing service: FastAPI + PostgreSQL transactional outbox + RabbitMQ (FastStream) with retries, DLQ and webhooks."
readme = "README.md"
authors = [
    { name = "Lia", email = "ilyakopkovwork@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.165.0",
    "faststream[cli,rabbit]>=0.7.9",
    "httpx>=0.28.1",
    "pydantic>=2",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
# Application, not a library: the `src` package is run in place
# (uvicorn src.main:app / faststream run ...), not built or installed.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "ASYNC", "SIM"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]
